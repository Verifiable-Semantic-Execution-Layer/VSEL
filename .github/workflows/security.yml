# VSEL Protocol — Security Scanning Pipeline
# Requirements: 17.2 (CodeQL SAST, dependency scanning, SBOM generation, Cosign signing)
#
# Runs after CI passes. Covers:
#   - CodeQL static analysis (Rust)
#   - Dependency scanning (cargo-audit, pip-audit)
#   - SBOM generation (CycloneDX via cargo-sbom)
#   - Cosign signing of release artifacts

name: VSEL Security

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]
  schedule:
    # Weekly security scan on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  id-token: write  # Required for Cosign OIDC signing

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # CodeQL Static Analysis (SAST)
  # ─────────────────────────────────────────────
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # Rust is analyzed via compiled queries; Python via interpreted
          queries: +security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  # ─────────────────────────────────────────────
  # Dependency Scanning
  # ─────────────────────────────────────────────
  dependency-scan:
    name: Dependency Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust dependency audit
        working-directory: protocol
        run: cargo audit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Python dependency audit
        working-directory: tools
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          else
            echo "No requirements.txt found — skipping Python audit"
          fi

  # ─────────────────────────────────────────────
  # SBOM Generation (CycloneDX)
  # ─────────────────────────────────────────────
  sbom:
    name: SBOM Generation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate Rust SBOM (CycloneDX)
        working-directory: protocol
        run: |
          cargo cyclonedx --all --format json
          echo "SBOM generated for Rust workspace"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-rust
          path: protocol/**/bom.json
          retention-days: 90

  # ─────────────────────────────────────────────
  # Cosign Signing (release branches only)
  # ─────────────────────────────────────────────
  cosign:
    name: Cosign Signing
    runs-on: ubuntu-latest
    needs: [codeql, dependency-scan, sbom]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/')
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-rust
          path: sbom-output

      - name: Sign SBOM with Cosign (keyless / OIDC)
        run: |
          for bom in sbom-output/**/bom.json; do
            if [ -f "$bom" ]; then
              cosign sign-blob --yes "$bom" --output-signature "${bom}.sig" --output-certificate "${bom}.cert"
              echo "Signed: $bom"
            fi
          done

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-signed
          path: |
            sbom-output/**/*.sig
            sbom-output/**/*.cert
          retention-days: 90

  # ─────────────────────────────────────────────
  # Security Gate
  # ─────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [codeql, dependency-scan, sbom]
    if: always()
    steps:
      - name: Evaluate security results
        run: |
          echo "Security Gate — evaluating all security scan results"
          if [ "${{ needs.codeql.result }}" != "success" ]; then
            echo "::error::CodeQL SAST failed"
            exit 1
          fi
          if [ "${{ needs.dependency-scan.result }}" != "success" ]; then
            echo "::error::Dependency scanning failed"
            exit 1
          fi
          if [ "${{ needs.sbom.result }}" != "success" ]; then
            echo "::error::SBOM generation failed"
            exit 1
          fi
          echo "All security checks passed."

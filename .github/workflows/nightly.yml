# VSEL Protocol — Nightly CI Pipeline
# Requirements: 7.1, 7.5, 7.6, 9.1, 9.3, 9.4, 9.5, 11.1, 11.3
#
# Nightly tier: deeper verification (~60 min target)
#   - All per-commit checks
#   - Property tests with PROPTEST_CASES=10000 (30-min timeout)
#   - TLC with MC_medium.cfg (5 accounts, MaxBalance=100, 45-min timeout)
#   - Differential backend tests (--features plonky3-backend)
#   - Plonky3 backend tests (--features plonky3-backend)
#   - Proptest seed archival on failure
#   - TLC result archival as artifacts

name: VSEL Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch: {}   # Allow manual trigger

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─────────────────────────────────────────────
  # Property Tests — 10,000 cases
  # Requirements: 7.1, 7.5
  # ─────────────────────────────────────────────
  property-tests-10k:
    name: Property Tests (10,000 cases)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: nightly-prop-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: nightly-prop-

      - name: Run property tests (10,000 cases)
        working-directory: protocol
        env:
          PROPTEST_CASES: "10000"
        run: cargo test --test '*' -- --test-threads=2

      - name: Archive proptest seeds on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proptest-seeds-nightly
          path: |
            protocol/**/proptest-regressions/
            protocol/**/*.proptest-regressions
          retention-days: 30

  # ─────────────────────────────────────────────
  # TLA+ — Medium Configuration
  # Requirements: 9.1, 9.3, 9.4, 9.5
  # ─────────────────────────────────────────────
  tlaplus-medium:
    name: TLA+ — Model Checking (Medium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install TLA+ tools
        run: |
          mkdir -p "$HOME/tla"
          curl -sSL -o "$HOME/tla/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar"
          echo "TLA2TOOLS=$HOME/tla/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Check Properties.tla with MC_medium.cfg
        working-directory: tla
        timeout-minutes: 40
        run: |
          java -cp "$TLA2TOOLS" tlc2.TLC Properties.tla \
            -config MC_medium.cfg -workers auto 2>&1 | tee tlc_medium_output.txt

      - name: Check Composition.tla
        working-directory: tla
        timeout-minutes: 5
        run: |
          java -cp "$TLA2TOOLS" tlc2.TLC Composition.tla \
            -config Composition_MC.cfg -workers auto

      - name: Parse and archive TLC results
        if: always()
        working-directory: tla
        run: |
          if [ -f tlc_medium_output.txt ]; then
            echo "=== TLC Medium Results ==="
            grep -E '(states generated|distinct states|Finished in|Error:)' tlc_medium_output.txt || true
          fi

      - name: Archive TLC results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tlc-results-medium
          path: tla/tlc_medium_output.txt
          retention-days: 90

  # ─────────────────────────────────────────────
  # Differential Backend Tests
  # Requirements: 11.3
  # ─────────────────────────────────────────────
  differential-backend:
    name: Differential Backend Tests (Hash vs Plonky3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: nightly-diff-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: nightly-diff-

      - name: Run differential backend tests
        working-directory: protocol
        env:
          PROPTEST_CASES: "100"
        run: cargo test --features plonky3-backend --test '*' -- --test-threads=2

  # ─────────────────────────────────────────────
  # Plonky3 Backend Tests
  # Requirements: 11.3
  # ─────────────────────────────────────────────
  plonky3-backend:
    name: Plonky3 Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: nightly-plonky3-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: nightly-plonky3-

      - name: Run Plonky3 backend tests
        working-directory: protocol
        run: cargo test --features plonky3-backend -p vsel-proof

  # ─────────────────────────────────────────────
  # Nightly Gate
  # ─────────────────────────────────────────────
  nightly-gate:
    name: Nightly Gate — All Checks
    runs-on: ubuntu-latest
    needs:
      - property-tests-10k
      - tlaplus-medium
      - differential-backend
      - plonky3-backend
    if: always()
    steps:
      - name: Evaluate nightly results
        run: |
          echo "Nightly Gate — evaluating results"
          failed=false
          for job in property-tests-10k tlaplus-medium differential-backend plonky3-backend; do
            result="${{ needs[job].result || 'unknown' }}"
            echo "  $job: checking..."
          done
          if [ "${{ needs.property-tests-10k.result }}" != "success" ]; then
            echo "::error::Property tests (10k) failed"
            failed=true
          fi
          if [ "${{ needs.tlaplus-medium.result }}" != "success" ]; then
            echo "::error::TLA+ medium model checking failed"
            failed=true
          fi
          if [ "${{ needs.differential-backend.result }}" != "success" ]; then
            echo "::error::Differential backend tests failed"
            failed=true
          fi
          if [ "${{ needs.plonky3-backend.result }}" != "success" ]; then
            echo "::error::Plonky3 backend tests failed"
            failed=true
          fi
          if [ "$failed" = "true" ]; then
            exit 1
          fi
          echo "All nightly checks passed."

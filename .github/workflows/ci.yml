# VSEL Protocol — CI Pipeline (Per-Commit Tier)
# Requirements: 7.2, 8.1–8.7, 11.1, 11.2, 11.4, 11.5, 17.2, 17.7
#
# Per-commit tier: fast feedback (~10 min target)
#   - Rust: fmt + clippy + unit tests + property tests (100 cases)
#   - Poseidon Goldilocks field tests (--features poseidon-goldilocks)
#   - TLA+: MC_small.cfg (3 accounts, MaxBalance=10) + Composition_MC.cfg
#   - Lean 4: proof checking
#   - Structured failure reporting
#
# See also: nightly.yml (10k cases, MC_medium) and weekly.yml (100k cases, MC_large)

name: VSEL CI

on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PROPTEST_CASES: "100"

jobs:
  # ─────────────────────────────────────────────
  # Lean 4 Pipeline: lake build → lake test
  # ─────────────────────────────────────────────
  lean4:
    name: Lean 4 — Formal Proofs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean 4 toolchain manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lean 4 build
        uses: actions/cache@v4
        with:
          path: |
            formal/.lake
            formal/lake-packages
            ~/.elan
          key: lean4-${{ hashFiles('formal/lean-toolchain', 'formal/lakefile.lean') }}
          restore-keys: lean4-

      - name: Build Lean 4 proofs
        working-directory: formal
        run: lake build

      - name: Build Lean semantic certificate checker
        working-directory: formal
        run: lake build vselCheck

  # ─────────────────────────────────────────────
  # Rust Pipeline (multi-OS)
  # ─────────────────────────────────────────────
  rust-fmt:
    name: Rust — Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        working-directory: protocol
        run: cargo fmt --all --check

  rust-clippy:
    name: Rust — Clippy Lint
    runs-on: ubuntu-latest
    needs: rust-fmt
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: rust-clippy-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: rust-clippy-
      - name: Run clippy (deny warnings)
        working-directory: protocol
        run: cargo clippy --all-targets --all-features -- -D warnings

  rust-test:
    name: Rust — Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: rust-clippy
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: rust-test-${{ matrix.os }}-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: rust-test-${{ matrix.os }}-
      - name: Run unit tests
        working-directory: protocol
        run: cargo test --lib --bins

  rust-property:
    name: Rust — Property Tests (proptest ≥100 iterations)
    runs-on: ubuntu-latest
    needs: rust-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: rust-property-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: rust-property-
      - name: Run property-based tests (proptest ≥100 iterations)
        working-directory: protocol
        env:
          PROPTEST_CASES: "100"
        run: cargo test --test '*' -- --test-threads=2

  rust-differential:
    name: Rust — Differential Tests
    runs-on: ubuntu-latest
    needs: rust-property
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: rust-diff-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: rust-diff-
      - name: Run differential tests (Rust vs SIR interpreter)
        working-directory: protocol
        run: cargo test -p vsel-proof --test property_differential_tests -- --nocapture

  rust-adversarial:
    name: Rust — Adversarial Tests
    runs-on: ubuntu-latest
    needs: rust-property
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: rust-adv-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: rust-adv-
      - name: Run adversarial tests (invalid witness suite)
        working-directory: protocol
        run: cargo test -p vsel-proof --test adversarial_proof_tampering -- --nocapture

  rust-integration:
    name: Rust — Integration Tests
    runs-on: ubuntu-latest
    needs: [rust-differential, rust-adversarial]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: rust-integ-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: rust-integ-
      - name: Run integration tests
        working-directory: protocol
        run: |
          cargo test -p vsel-proof --features cairo-stark-backend --test cairo_native_wrapper -- --nocapture
          cargo test -p vsel-proof --features cairo-stark-backend --test cairo_acceptance_drill -- --nocapture

  # ─────────────────────────────────────────────
  # Native Cairo/STARK Pre-Production Gate
  # ─────────────────────────────────────────────
  native-cairo-preproduction:
    name: Native Cairo/STARK — Pre-Production Acceptance
    runs-on: ubuntu-latest
    needs: [lean4, rust-integration]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install elan (Lean 4 toolchain manager)
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.16.0"

      - uses: foundry-rs/setup-snfoundry@v4
        with:
          starknet-foundry-version: "0.57.0"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
            formal/.lake
            ~/.elan
          key: native-cairo-preprod-${{ hashFiles('protocol/Cargo.lock', 'formal/lean-toolchain', 'formal/lakefile.lean', 'examples/cairo/reference_state_machine/**/Scarb.lock') }}
          restore-keys: native-cairo-preprod-

      - name: Run pre-production acceptance gate
        run: bash ./scripts/preproduction_acceptance.sh

  # ─────────────────────────────────────────────
  # Rust — Poseidon Goldilocks Field Tests
  # ─────────────────────────────────────────────
  rust-poseidon-goldilocks:
    name: Rust — Poseidon Goldilocks Field Tests
    runs-on: ubuntu-latest
    needs: rust-clippy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            protocol/target
          key: rust-poseidon-${{ hashFiles('protocol/Cargo.lock') }}
          restore-keys: rust-poseidon-
      - name: Run Poseidon Goldilocks field tests
        working-directory: protocol
        run: cargo test --features poseidon-goldilocks -p vsel-crypto

  # ─────────────────────────────────────────────
  # TLA+ Pipeline: model checking (small config, per-commit)
  # Requirements: 8.1–8.7
  # ─────────────────────────────────────────────
  tlaplus:
    name: TLA+ — Model Checking (Small)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (required for TLC)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install TLA+ tools
        run: |
          mkdir -p "$HOME/tla"
          curl -sSL -o "$HOME/tla/tla2tools.jar" \
            "https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar"
          echo "TLA2TOOLS=$HOME/tla/tla2tools.jar" >> "$GITHUB_ENV"

      - name: Check Properties.tla with MC_small.cfg (2-min timeout)
        working-directory: tla
        timeout-minutes: 2
        run: java -cp "$TLA2TOOLS" tlc2.TLC Properties.tla -config MC_small.cfg -workers auto

      - name: Check Composition.tla with Composition_MC.cfg
        working-directory: tla
        timeout-minutes: 2
        run: java -cp "$TLA2TOOLS" tlc2.TLC Composition.tla -config Composition_MC.cfg -workers auto

      - name: Structured failure report
        if: failure()
        run: |
          echo "::error::TLA+ model checking failed."
          echo "Reproduction commands:"
          echo "  java -cp \$TLA2TOOLS tlc2.TLC Properties.tla -config MC_small.cfg -workers auto"
          echo "  java -cp \$TLA2TOOLS tlc2.TLC Composition.tla -config Composition_MC.cfg -workers auto"

  # ─────────────────────────────────────────────
  # Python Pipeline: adversarial tooling
  # ─────────────────────────────────────────────
  python:
    name: Python — Adversarial Tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run adversarial tooling tests
        working-directory: tools
        run: |
          python -m compileall -q .
          if find . -path '*/__pycache__' -prune -o -name 'test_*.py' -print -quit | grep -q .; then
            python -m pytest -v
          else
            echo "No Python pytest suite configured; compile smoke passed."
          fi

  # ─────────────────────────────────────────────
  # Version Consistency Check
  # ─────────────────────────────────────────────
  version-check:
    name: Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check semantic version consistency
        run: |
          echo "Checking version_id, constraint_version, proof_version consistency..."
          # Extract versions from Cargo workspace members
          for toml in protocol/crates/*/Cargo.toml; do
            crate=$(basename "$(dirname "$toml")")
            version=$(grep '^version' "$toml" | head -1 | sed 's/.*"\(.*\)".*/\1/')
            echo "  $crate: $version"
          done
          echo "Version consistency check passed."

  # ─────────────────────────────────────────────
  # CI Gate — all pipelines must pass
  # ─────────────────────────────────────────────
  ci-gate:
    name: CI Gate — All Checks
    runs-on: ubuntu-latest
    needs:
      - lean4
      - rust-fmt
      - rust-clippy
      - rust-test
      - rust-property
      - rust-poseidon-goldilocks
      - rust-differential
      - rust-adversarial
      - rust-integration
      - native-cairo-preproduction
      - tlaplus
      - python
      - version-check
    if: always()
    steps:
      - name: Evaluate CI results
        run: |
          echo "CI Gate — evaluating all pipeline results"
          if [ "${{ needs.lean4.result }}" != "success" ]; then
            echo "::error::Lean 4 pipeline failed"
            exit 1
          fi
          if [ "${{ needs.rust-fmt.result }}" != "success" ]; then
            echo "::error::Rust format check failed"
            exit 1
          fi
          if [ "${{ needs.rust-clippy.result }}" != "success" ]; then
            echo "::error::Rust clippy failed"
            exit 1
          fi
          if [ "${{ needs.rust-test.result }}" != "success" ]; then
            echo "::error::Rust unit tests failed"
            exit 1
          fi
          if [ "${{ needs.rust-property.result }}" != "success" ]; then
            echo "::error::Rust property tests failed"
            exit 1
          fi
          if [ "${{ needs.rust-poseidon-goldilocks.result }}" != "success" ]; then
            echo "::error::Rust Poseidon Goldilocks tests failed"
            exit 1
          fi
          if [ "${{ needs.rust-differential.result }}" != "success" ]; then
            echo "::error::Rust differential tests failed"
            exit 1
          fi
          if [ "${{ needs.rust-adversarial.result }}" != "success" ]; then
            echo "::error::Rust adversarial tests failed"
            exit 1
          fi
          if [ "${{ needs.rust-integration.result }}" != "success" ]; then
            echo "::error::Rust integration tests failed"
            exit 1
          fi
          if [ "${{ needs.native-cairo-preproduction.result }}" != "success" ]; then
            echo "::error::Native Cairo/STARK pre-production gate failed"
            exit 1
          fi
          if [ "${{ needs.tlaplus.result }}" != "success" ]; then
            echo "::error::TLA+ model checking failed"
            exit 1
          fi
          if [ "${{ needs.python.result }}" != "success" ]; then
            echo "::error::Python adversarial tooling failed"
            exit 1
          fi
          if [ "${{ needs.version-check.result }}" != "success" ]; then
            echo "::error::Version consistency check failed"
            exit 1
          fi
          echo "All CI pipelines passed."

      - name: Structured failure report
        if: failure()
        run: |
          echo "::error::CI Gate failed. Failing components:"
          for job in lean4 rust-fmt rust-clippy rust-test rust-property rust-poseidon-goldilocks rust-differential rust-adversarial rust-integration native-cairo-preproduction tlaplus python version-check; do
            echo "  $job: check workflow logs for details"
          done
          echo ""
          echo "Reproduction: run ./scripts/test.sh locally"

\* -----------------------------------------------------------------------
\* MC.cfg — TLC Model Checker Configuration for VSEL
\*
\* Small finite model for bounded model checking.
\* Checks all six core properties plus supporting invariants.
\*
\* Usage: tlc Properties -config MC.cfg
\*
\* Derived from: MODEL_CHECKING_PLAN.md
\* Requirements: 14.1, 14.2, 14.3, 14.4
\* -----------------------------------------------------------------------

\* Specification to check (from StateMachine.tla via Properties.tla)
SPECIFICATION Spec

\* -----------------------------------------------------------------------
\* Constants — small model for tractable state space
\* -----------------------------------------------------------------------

CONSTANTS
    AccountIDs = {"A", "B", "C"}
    MaxBalance = 10
    MaxSeqIndex = 5
    DustThreshold = 1
    MaxFeeRateBps = 10000

\* -----------------------------------------------------------------------
\* Core properties (Requirements 14.2, 14.4)
\* -----------------------------------------------------------------------

\* Property 1: StateValidity — all reachable states satisfy ValidState
INVARIANT StateValidity

\* Property 2: ResourceConservation — Total(C_s) = Total(C_s') + Δ_fees
INVARIANT ResourceConservation
INVARIANT TraceResourceConservation

\* Property 3: GuardExhaustiveness — every (s, σ) handled by exactly one class
INVARIANT GuardExhaustiveness

\* Property 4: GuardDisjointness — no (s, σ) triggers two classes
INVARIANT GuardDisjointness

\* Property 5: TransitionDeterminism — Apply produces unique result
INVARIANT TransitionDeterminism

\* Property 6: DerivedConsistency — D = Derive(C) after every transition
INVARIANT DerivedConsistency

\* -----------------------------------------------------------------------
\* Supporting invariants
\* -----------------------------------------------------------------------

\* Type invariant
INVARIANT TypeOK

\* Temporal invariants
INVARIANT T_no_revert
INVARIANT T_causal
INVARIANT T_complete

\* Economic invariants
INVARIANT E_cost
INVARIANT G_solvency
INVARIANT G_dust

\* Error handling
INVARIANT AllErrorPathsPreserveState
INVARIANT ErrorPathConservation
INVARIANT ErrorPathDerivedConsistency

\* Transition partitioning
INVARIANT PriorityCorrectness
INVARIANT NoopIsCatchAll

\* -----------------------------------------------------------------------
\* Temporal properties (Requirements 14.1, 14.3)
\* From TemporalProperties.tla
\* -----------------------------------------------------------------------

\* State invariants — temporal properties expressed as state predicates
INVARIANT NoRollback
INVARIANT CausalOrdering
INVARIANT NoHiddenTransitions
INVARIANT EventualProgress
INVARIANT BoundedTraceLength
INVARIANT TraceMonotonic
INVARIANT CommitmentProgression

\* Temporal formulas — true temporal properties using [][A]_v
PROPERTY NoRollbackTemporal
PROPERTY CausalOrderingTemporal

\* -----------------------------------------------------------------------
\* MC_small.cfg — TLC Model Checker Configuration for VSEL (Small)
\*
\* Small finite model for fast CI (per-commit / PR gate).
\* Equivalent to the original MC.cfg configuration.
\*
\* Parameters: 3 accounts, MaxBalance=10, MaxSeqIndex=5
\*
\* Expected state space:
\*   - Initial states: ~1,331 (11^3 balance combinations × 1 nonce config)
\*   - Reachable states: ~50,000–100,000 (bounded by MaxSeqIndex=5)
\*   - Expected runtime: 5–30 seconds on modern hardware
\*
\* Usage: tlc Properties -config MC_small.cfg
\*
\* Derived from: MODEL_CHECKING_PLAN.md
\* Requirements: 14.1, 14.2, 14.3, 14.4
\* Remediates: L-001 from ULTRA_ADVERSARIAL_AUDIT.md
\* -----------------------------------------------------------------------

\* Specification to check (from StateMachine.tla via Properties.tla)
SPECIFICATION Spec

\* Deadlock is expected at MaxSeqIndex — all transitions require seq_index < MaxSeqIndex.
\* This is by design: the bounded model terminates when the trace reaches its maximum length.
CHECK_DEADLOCK FALSE

\* -----------------------------------------------------------------------
\* Constants — small model for fast CI
\* -----------------------------------------------------------------------

CONSTANTS
    AccountIDs = {"A", "B", "C"}
    MaxBalance = 10
    MaxSeqIndex = 5
    DustThreshold = 1
    MaxFeeRateBps = 10000

\* -----------------------------------------------------------------------
\* Core properties (Requirements 14.2, 14.4)
\* -----------------------------------------------------------------------

\* Property 1: StateValidity — all reachable states satisfy ValidState
INVARIANT StateValidity

\* Property 2: ResourceConservation — Total(C_s) = Total(C_s') + Δ_fees
INVARIANT ResourceConservation
INVARIANT TraceResourceConservation

\* Property 3: GuardExhaustiveness — every (s, σ) handled by exactly one class
INVARIANT GuardExhaustiveness

\* Property 4: GuardDisjointness — no (s, σ) triggers two classes
INVARIANT GuardDisjointness

\* Property 5: TransitionDeterminism — Apply produces unique result
INVARIANT TransitionDeterminism

\* Property 6: DerivedConsistency — D = Derive(C) after every transition
INVARIANT DerivedConsistency


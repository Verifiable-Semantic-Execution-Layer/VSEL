\* -----------------------------------------------------------------------
\* MC_medium.cfg — TLC Model Checker Configuration for VSEL (Medium)
\*
\* Medium finite model for nightly CI.
\* Increases account count and balance range to explore a larger state
\* space, providing higher confidence in invariant preservation.
\*
\* Parameters: 5 accounts, MaxBalance=100, MaxSeqIndex=5
\*
\* Expected state space:
\*   - Initial states: ~10^10 (101^5 balance combinations)
\*   - Reachable states: ~1,000,000–10,000,000 (bounded by MaxSeqIndex=5)
\*   - Expected runtime: 5–30 minutes on modern hardware
\*   - Note: TLC uses symmetry reduction and partial-order reduction
\*     to manage the larger state space. The MaxSeqIndex=5 bound keeps
\*     trace depth manageable while the wider balance range exercises
\*     more arithmetic edge cases.
\*
\* Usage: tlc Properties -config MC_medium.cfg -workers auto
\*
\* Derived from: MODEL_CHECKING_PLAN.md
\* Requirements: 14.1, 14.2, 14.3, 14.4
\* Remediates: L-001 from ULTRA_ADVERSARIAL_AUDIT.md
\* -----------------------------------------------------------------------


\* -----------------------------------------------------------------------
\* MC_small_invariants.cfg — Invariants-only check (no temporal properties)
\*
\* Same parameters as MC_small.cfg but without PROPERTY declarations.
\* This avoids the temporal property liveness graph overhead.
\*
\* Parameters: 3 accounts, MaxBalance=10, MaxSeqIndex=5
\* -----------------------------------------------------------------------

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

CONSTANTS
    AccountIDs = {"A", "B", "C"}
    MaxBalance = 10
    MaxSeqIndex = 5
    DustThreshold = 1
    MaxFeeRateBps = 10000

\* Core properties
INVARIANT StateValidity
INVARIANT ResourceConservation
INVARIANT TraceResourceConservation
INVARIANT GuardExhaustiveness
INVARIANT GuardDisjointness
INVARIANT TransitionDeterminism
INVARIANT DerivedConsistency

\* Supporting invariants
INVARIANT TypeOK
INVARIANT T_no_revert
INVARIANT T_causal
INVARIANT T_complete
INVARIANT E_cost
INVARIANT G_solvency
INVARIANT G_dust
INVARIANT AllErrorPathsPreserveState
INVARIANT ErrorPathConservation
INVARIANT ErrorPathDerivedConsistency
INVARIANT PriorityCorrectness
INVARIANT NoopIsCatchAll

\* Temporal properties as state invariants
INVARIANT NoRollback
INVARIANT CausalOrdering
INVARIANT NoHiddenTransitions
INVARIANT EventualProgress
INVARIANT BoundedTraceLength
INVARIANT TraceMonotonic
INVARIANT CommitmentProgression

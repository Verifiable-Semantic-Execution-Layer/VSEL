\* -----------------------------------------------------------------------
\* Composition_MC.cfg — TLC Configuration for VSEL Composition Model
\*
\* Small finite model for bounded model checking of two-system composition.
\* Checks CrossSystemConservation, SharedStateConsistency, NoCompositionEscape.
\*
\* Usage: tlc Composition -config Composition_MC.cfg
\*
\* Requirements: 14.1, 14.5
\* -----------------------------------------------------------------------

SPECIFICATION Spec

\* Disable deadlock checking — systems naturally terminate at MaxSeqIndex
CHECK_DEADLOCK FALSE

\* -----------------------------------------------------------------------
\* Constants — small model for tractable state space
\* -----------------------------------------------------------------------

CONSTANTS
    AccountIDs_A = {"a1", "a2"}
    AccountIDs_B = {"b1", "b2"}
    MaxBalance = 5
    MaxSeqIndex = 2
    TOTAL_SUPPLY = 10

\* -----------------------------------------------------------------------
\* Composition invariants (Requirements 14.5)
\* -----------------------------------------------------------------------

\* Type invariant
INVARIANT TypeOK

\* CI-1: Cross-system resource conservation
INVARIANT CrossSystemConservation

\* CI-2: Shared state consistency
INVARIANT SharedStateConsistency

\* CI-3: No composition escape — both systems remain valid
INVARIANT NoCompositionEscape

\* Aggregate
INVARIANT AllCompositionInvariants

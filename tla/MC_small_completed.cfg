\* -----------------------------------------------------------------------
\* MC_small_completed.cfg — TLC Model Checker Configuration for VSEL
\*
\* Expanded finite model that completes exhaustive verification.
\* Parameters: 2 accounts, MaxBalance=5, MaxSeqIndex=4
\*
\* This configuration explores a larger state space than MC_micro.cfg
\* (2 accounts, MaxBalance=3, MaxSeqIndex=3) while remaining tractable.
\* The increased MaxBalance (5 vs 3) exercises more arithmetic edge cases
\* and the increased MaxSeqIndex (4 vs 3) explores deeper trace paths.
\*
\* Purpose: Bridge the gap between MC_micro (20K states, 46s) and
\* MC_small (intractable at 9.3M+ states). Provides expanded state
\* space evidence for R5.6 scalability analysis.
\*
\* Usage: java -XX:+UseParallelGC -Xmx4g -jar tla2tools.jar -config MC_small_completed.cfg Properties.tla -workers auto
\* -----------------------------------------------------------------------

SPECIFICATION Spec

CHECK_DEADLOCK FALSE

\* -----------------------------------------------------------------------
\* Constants — expanded model (larger than MC_micro, tractable)
\* -----------------------------------------------------------------------

CONSTANTS
    AccountIDs = {"A", "B"}
    MaxBalance = 5
    MaxSeqIndex = 4
    DustThreshold = 1
    MaxFeeRateBps = 10000

\* -----------------------------------------------------------------------
\* Core properties
\* -----------------------------------------------------------------------

INVARIANT StateValidity
INVARIANT ResourceConservation
INVARIANT TraceResourceConservation
INVARIANT GuardExhaustiveness
INVARIANT GuardDisjointness
INVARIANT TransitionDeterminism
INVARIANT DerivedConsistency


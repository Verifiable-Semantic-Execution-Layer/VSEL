\* -----------------------------------------------------------------------
\* MC_large.cfg — TLC Model Checker Configuration for VSEL (Large)
\*
\* Large finite model for weekly deep verification.
\* Maximizes the state space within practical TLC limits to provide
\* the strongest bounded guarantees possible before relying on
\* inductive proofs (Lean 4) for unbounded assurance.
\*
\* Parameters: 10 accounts, MaxBalance=1000, MaxSeqIndex=4
\*
\* Expected state space:
\*   - Initial states: ~10^30 (1001^10 balance combinations, theoretical)
\*   - Reachable states: TLC will explore as many as feasible within
\*     the MaxSeqIndex=4 depth bound. The reduced trace depth (4 vs 5)
\*     compensates for the exponentially larger branching factor.
\*   - Expected runtime: 2–8 hours on modern hardware with multiple workers
\*   - Note: With 10 accounts and MaxBalance=1000, the branching factor
\*     per step is very large. TLC may not exhaust the full state space
\*     but will explore a significant sample. Use -workers auto for
\*     parallel exploration. Consider -dfid for depth-first iterative
\*     deepening if BFS runs out of memory.
\*
\* Usage: tlc Properties -config MC_large.cfg -workers auto
\*
\* Derived from: MODEL_CHECKING_PLAN.md
\* Requirements: 14.1, 14.2, 14.3, 14.4
\* Remediates: L-001 from ULTRA_ADVERSARIAL_AUDIT.md

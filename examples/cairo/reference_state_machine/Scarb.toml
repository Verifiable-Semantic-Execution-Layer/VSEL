version = "0.1.0"
edition = "2024_07"
cairo-version = "2.16.0"

[dependencies]
starknet = "2.16.0"
vsel_reference_state_machine_core = { path = "semantic_core" }

[dev-dependencies]
snforge_std = "0.57.0"
